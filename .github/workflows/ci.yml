name: ci

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "9.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NODE_VERSION: "20"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore HR.sln
      - run: dotnet build HR.sln --configuration Release --no-restore

  test:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore HR.sln
      - run: dotnet test HR.sln --configuration Release --no-restore --logger trx --verbosity normal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  scan-secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for potential secrets..."
          FOUND=0
          # Check for common secret patterns (API keys, passwords in code)
          if grep -rn --include="*.cs" --include="*.ts" --include="*.tsx" --include="*.json" \
            -E '(password|secret|api_key|apikey)\s*[:=]\s*"[^"]{8,}"' \
            --exclude-dir=node_modules --exclude-dir=bin --exclude-dir=obj \
            . 2>/dev/null | grep -v -E '(example|placeholder|ChangeMe|test|mock|fake|dummy|\.env)'; then
            echo "::warning::Potential hardcoded secrets found. Review the matches above."
          fi
          echo "Secret scan complete."